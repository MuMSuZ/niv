    <title>Estimated Duration of NIV</title>

        <header>
            <div class="container">
                <h1>Estimated Duration of NIV</h1>

                </div>
                <div class="form-group">
                    <label for="ekspiryum">end-expiratory Diaphragm Thickness (mm):</label>
                    <input type="text" id="ekspiryum" name="ekspiryum"><br><br>
                </div>

                    <button class="calculate-btn" type="button" id="calculate-btn">Calculate</button>
